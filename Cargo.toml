[workspace]
# Required for wgpu in the simulator
resolver = "2"

members = [
    "effects-1d",
    "effects-1d-common",
    "effects-1d-simulator",
    "effects-1d-runtime",
]

## Recommended by bevy:
# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
rand = { version = "0.8.5", default-features = false }
palette = { version = "0.7.0", default-features = false, features = ["libm"] }
paste = "1.0.12"

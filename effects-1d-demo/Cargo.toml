[package]
name = "effects-1d-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
effects-1d = { path = "../effects-1d" }
effects-1d-common = { path = "../effects-1d-common" }
effects-1d-simulator = { path = "../effects-1d-simulator" }
tracing = { workspace = true }
three-d = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2.1"
tracing-log = "0.2.0"
